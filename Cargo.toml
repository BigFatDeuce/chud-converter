[workspace]
resolver = "3"
members = [
    "crates/chud-core",
    "crates/chud-process",
    "crates/chud-engines",
    "crates/chud-jobs",
    "crates/chud-enginemgr",
    "crates/chud-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/BigFatDeuce/chud-converter"
homepage = "https://github.com/BigFatDeuce/chud-converter"
authors = ["Chud Converter contributors"]

[workspace.dependencies]
chud-core = { path = "crates/chud-core" }
chud-process = { path = "crates/chud-process" }
chud-engines = { path = "crates/chud-engines" }
chud-jobs = { path = "crates/chud-jobs" }
chud-enginemgr = { path = "crates/chud-enginemgr" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
thiserror = "2"
regex = "1"
crossbeam-channel = "0.5"
directories = "6"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
csv = "1.4"
serde_norway = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff"] }
file-format = { version = "0.29", features = ["reader"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

id = "qpdf"
name = "qpdf"
adapter = "qpdf"
homepage = "https://qpdf.sourceforge.io"
license = "Apache-2.0"
description = "PDF : fusion, découpe, réparation, linéarisation, chiffrement."
description_en = "PDF: merge, split, repair, linearize, encrypt."
categories = ['pdf']
executables = ['qpdf']

[detect]
version_args = ['--version']
version_regex = 'qpdf version ([0-9][0-9.]*)'
known_paths_windows = ['%ProgramFiles%\qpdf*\bin\qpdf.exe']
known_paths_linux = ['/usr/bin/qpdf']
known_paths_macos = ['/opt/homebrew/bin/qpdf']

[hints]
windows = "winget install QPDF.QPDF"
linux = "sudo apt install qpdf"
macos = "brew install qpdf"

# Installation depuis l'application : publication officielle (qpdf/qpdf). La version Windows
# embarque son runtime Visual C++.

[[install]]
platform = "windows-x86_64"
version = "12.4.2"
method = "zip"
publisher = "Jay Berkenbilt, auteur de qpdf (publication officielle)"
publisher_en = "Jay Berkenbilt, author of qpdf (official release)"
page = "https://github.com/qpdf/qpdf/releases/tag/v12.4.2"
files = [
  { url = "https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2-msvc64.zip", sha256 = "db87077e683630c1217e0e8f9a20a9749d952ab676e881c3689187763a5de25d", size = 28183147 },
]


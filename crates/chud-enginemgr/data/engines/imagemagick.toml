id = "imagemagick"
name = "ImageMagick"
adapter = "imagemagick"
homepage = "https://imagemagick.org"
license = "ImageMagick (compatible Apache-2.0)"
license_en = "ImageMagick (Apache-2.0 compatible)"
description = "Images : plus de 200 formats."
description_en = "Images: more than 200 formats."
categories = ['image']
# « convert » n'est jamais utilisé : sous Windows, c'est l'outil système de conversion de disque.
executables = ['magick']

[detect]
version_args = ['-version']
version_regex = 'ImageMagick ([0-9][0-9.\-]*)'
known_paths_windows = ['%ProgramFiles%\ImageMagick*\magick.exe']
known_paths_linux = ['/usr/bin/magick']
known_paths_macos = ['/opt/homebrew/bin/magick']

[hints]
windows = "winget install ImageMagick.ImageMagick"
linux = "sudo apt install imagemagick"
macos = "brew install imagemagick"

# Installation depuis l'application : versions portables officielles (ImageMagick/ImageMagick).
# Windows : l'archive .7z est ouverte par 7zr ; magick.exe utilise le runtime Visual C++ (OpenMP).

[[install]]
platform = "windows-x86_64"
version = "7.1.2-36"
method = "sevenzip"
publisher = "ImageMagick Studio LLC (publication officielle, version portable)"
publisher_en = "ImageMagick Studio LLC (official release, portable build)"
page = "https://github.com/ImageMagick/ImageMagick/releases/tag/7.1.2-36"
files = [
  { url = "https://github.com/ip7z/7zip/releases/download/26.06/7zr.exe", sha256 = "e80db2dad715a6c5adabe292d31ed54e11f4e9b99ca349827b50573b175891bc", size = 600064 },
  { url = "https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-36/ImageMagick-7.1.2-36-portable-Q16-HDRI-x64.7z", sha256 = "e7c705840e2d989eb9fdbd5c2ac87c5b7a9f95b97daee1a1e6e66aa152548ae5", size = 12205968 },
]
vcruntime = true


id = "pandoc"
name = "Pandoc"
adapter = "pandoc"
homepage = "https://pandoc.org"
license = "GPL-2.0-or-later"
description = "Documents texte : Markdown, HTML, DOCX, ODT, EPUB, LaTeX…"
description_en = "Text documents: Markdown, HTML, DOCX, ODT, EPUB, LaTeX…"
categories = ['document', 'ebook']
executables = ['pandoc']

[detect]
version_args = ['--version']
version_regex = 'pandoc(?:\.exe)? ([0-9][0-9.]*)'
known_paths_windows = ['%LOCALAPPDATA%\Pandoc\pandoc.exe', '%ProgramFiles%\Pandoc\pandoc.exe']
known_paths_linux = ['/usr/bin/pandoc']
known_paths_macos = ['/opt/homebrew/bin/pandoc']

[hints]
windows = "winget install JohnMacFarlane.Pandoc"
linux = "sudo apt install pandoc"
macos = "brew install pandoc"

# Installation depuis l'application : publication officielle (jgm/pandoc), un seul exécutable autonome.

[[install]]
platform = "windows-x86_64"
version = "3.14"
method = "zip"
publisher = "John MacFarlane, auteur de Pandoc (publication officielle)"
publisher_en = "John MacFarlane, author of Pandoc (official release)"
page = "https://github.com/jgm/pandoc/releases/tag/3.14"
files = [
  { url = "https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-windows-x86_64.zip", sha256 = "0144b96e8c7b023fd382ec5ef5bdc475e873f1019d6fa72502492df2c9a94a3b", size = 43614099 },
]


id = "tesseract"
name = "Tesseract OCR"
adapter = "none"
homepage = "https://github.com/tesseract-ocr/tesseract"
license = "Apache-2.0"
description = "Reconnaissance de texte (OCR) dans les images et les PDF numérisés."
description_en = "Text recognition (OCR) in images and scanned PDFs."
categories = ['image', 'pdf']
executables = ['tesseract']

[detect]
version_args = ['--version']
version_regex = 'tesseract v?([0-9][0-9.]*)'
known_paths_windows = ['%ProgramFiles%\Tesseract-OCR\tesseract.exe']
known_paths_linux = ['/usr/bin/tesseract']
known_paths_macos = ['/opt/homebrew/bin/tesseract']

[hints]
windows = "winget install UB-Mannheim.TesseractOCR"
linux = "sudo apt install tesseract-ocr tesseract-ocr-fra"
macos = "brew install tesseract tesseract-lang"

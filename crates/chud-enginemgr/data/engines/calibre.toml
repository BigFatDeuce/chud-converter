id = "calibre"
name = "Calibre (ebook-convert)"
adapter = "calibre"
homepage = "https://calibre-ebook.com"
license = "GPL-3.0-or-later"
description = "Livres numériques : EPUB, MOBI, AZW3, FB2…"
description_en = "E-books: EPUB, MOBI, AZW3, FB2…"
categories = ['ebook']
executables = ['ebook-convert']

[detect]
version_args = ['--version']
version_regex = 'calibre ([0-9][0-9.]*)'
known_paths_windows = ['%ProgramFiles%\Calibre2\ebook-convert.exe']
known_paths_linux = ['/usr/bin/ebook-convert']
known_paths_macos = ['/Applications/calibre.app/Contents/MacOS/ebook-convert']

[hints]
windows = "winget install calibre.calibre"
linux = "sudo apt install calibre"
macos = "brew install --cask calibre"

# Installation depuis l'application : publication officielle (kovidgoyal/calibre). Windows : paquet
# MSI extrait par « msiexec /a » (rien n'est enregistré sur le système) ; Linux : archive autonome.

[[install]]
platform = "windows-x86_64"
version = "9.18.0"
method = "msi"
publisher = "Kovid Goyal, auteur de Calibre (publication officielle)"
publisher_en = "Kovid Goyal, author of Calibre (official release)"
page = "https://github.com/kovidgoyal/calibre/releases/tag/v9.18.0"
files = [
  { url = "https://github.com/kovidgoyal/calibre/releases/download/v9.18.0/calibre-64bit-9.18.0.msi", sha256 = "05c0f2223866f8082e05b2d4bc9c57b31a833de8355a1191fd79c260c2636d38", size = 291291136 },
]


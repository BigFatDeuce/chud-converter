id = "7zip"
name = "7-Zip"
adapter = "7zip"
homepage = "https://www.7-zip.org"
license = "LGPL-2.1-or-later (+ restriction unRAR)"
description = "Archives : 7z, ZIP, RAR, TAR, GZ, XZ, ISO, CAB…"
categories = ['archive']
executables = ['7z']
executables_linux = ['7zz', '7z']
executables_macos = ['7zz', '7z']

[detect]
version_args = []
version_regex = '7-Zip(?: \(a\))?(?: \[64\])? ([0-9]+\.[0-9]+)'
known_paths_windows = ['%ProgramFiles%\7-Zip\7z.exe', '%ProgramFiles(x86)%\7-Zip\7z.exe', '%LOCALAPPDATA%\Programs\7-Zip\7z.exe']
known_paths_linux = ['/usr/bin/7zz', '/usr/bin/7z']
known_paths_macos = ['/opt/homebrew/bin/7zz', '/usr/local/bin/7zz']

[hints]
windows = "winget install 7zip.7zip"
linux = "sudo apt install 7zip"
macos = "brew install sevenzip"

id = "7zip"
name = "7-Zip"
adapter = "7zip"
homepage = "https://www.7-zip.org"
license = "LGPL-2.1-or-later (+ restriction unRAR)"
license_en = "LGPL-2.1-or-later (+ unRAR restriction)"
description = "Archives : 7z, ZIP, RAR, TAR, GZ, XZ, ISO, CAB…"
description_en = "Archives: 7z, ZIP, RAR, TAR, GZ, XZ, ISO, CAB…"
categories = ['archive']
executables = ['7z']
executables_linux = ['7zz', '7z']
executables_macos = ['7zz', '7z']

[detect]
version_args = []
# « 7-Zip 26.06 », « 7-Zip (a) 23.01 » (7za), « 7-Zip (z) 26.06 » (7zz sous Linux), « 7-Zip [64] 16.02 » (p7zip).
version_regex = '7-Zip(?: \([a-z]\))?(?: \[64\])? ([0-9]+\.[0-9]+)'
known_paths_windows = ['%ProgramFiles%\7-Zip\7z.exe', '%ProgramFiles(x86)%\7-Zip\7z.exe', '%LOCALAPPDATA%\Programs\7-Zip\7z.exe']
known_paths_linux = ['/usr/bin/7zz', '/usr/bin/7z']
known_paths_macos = ['/opt/homebrew/bin/7zz', '/usr/local/bin/7zz']

[hints]
windows = "winget install 7zip.7zip"
linux = "sudo apt install 7zip"
macos = "brew install sevenzip"

# Installation depuis l'application, depuis la publication officielle d'Igor Pavlov (ip7z/7zip).
# Windows : l'installeur est ouvert comme une archive par 7zr.exe (vérifié lui aussi) ; il n'est
# jamais exécuté et ne touche ni au registre ni à une installation existante.
[[install]]
platform = "windows-x86_64"
version = "26.06"
method = "sevenzip-sfx"
publisher = "Igor Pavlov, auteur de 7-Zip (publication officielle)"
publisher_en = "Igor Pavlov, author of 7-Zip (official release)"
page = "https://github.com/ip7z/7zip/releases/tag/26.06"
files = [
  { url = "https://github.com/ip7z/7zip/releases/download/26.06/7zr.exe", sha256 = "e80db2dad715a6c5adabe292d31ed54e11f4e9b99ca349827b50573b175891bc", size = 600064 },
  { url = "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-x64.exe", sha256 = "9b697f65ecc2d9b0152f5ee96d72dde522a7827690349d9307935dacf40f42ec", size = 1659704 },
]

[[install]]
platform = "linux-x86_64"
version = "26.06"
method = "tar-xz"
publisher = "Igor Pavlov, auteur de 7-Zip (publication officielle)"
publisher_en = "Igor Pavlov, author of 7-Zip (official release)"
page = "https://github.com/ip7z/7zip/releases/tag/26.06"

# Catalogue des formats connus de Chud Converter.
#
# Champs :
#   id           identifiant stable (minuscules)            obligatoire
#   name         nom affiché                                 obligatoire
#   name_en      nom anglais, si différent
#   category     image | audio | video | document | spreadsheet | presentation | pdf | ebook
#                | archive | data | subtitle | font | model3d | geo | other
#   extensions   extensions sans point, la première sert à nommer les sorties
#   mime         types MIME
#   compression  lossless | lossy | both | none
#   features     caractéristiques que le format PEUT contenir (sert au calcul des pertes)
#   text         true si le format est textuel (heuristiques de détection)
#   based_on     formats « porteurs » reconnus par signature (ex. CBZ → zip, NEF → tiff)
#   variant_of   variante proposée comme cible mais jamais renvoyée par la détection
#   pivot        format intermédiaire sans perte privilégié par le planificateur
#   source_only  jamais étape intermédiaire (ex. CBZ : seul un vrai fichier BD contient des pages)
#   limitations  limites du format affichées avant conversion
#   limitations_en  les mêmes, en anglais (obligatoire avec limitations)

# ───────────────────────────── Images ─────────────────────────────
[[format]]
id = "png"
name = "PNG"
category = "image"
extensions = ["png"]
mime = ["image/png"]
compression = "lossless"
features = ["alpha", "high_bit_depth", "icc", "exif", "xmp"]
pivot = true


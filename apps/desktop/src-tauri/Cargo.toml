[package]
name = "chud-desktop"
description = "Desktop app for Chud Converter (Tauri 2 + Svelte 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chud-converter"
path = "src/main.rs"

[dependencies]
chud-core.workspace = true
chud-jobs.workspace = true
chud-enginemgr.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }

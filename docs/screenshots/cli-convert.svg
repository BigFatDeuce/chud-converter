<text class="t" x="442.0" y="22.5" text-anchor="middle" fill="#8fa8c8">Windows PowerShell — chud</text>
<text x="22" y="68" xml:space="preserve"><tspan fill="#38d6ff" font-weight="600">PS D:\Videos&gt; </tspan><tspan fill="#ffffff" font-weight="600">chud convert vacances.mkv reunion.mp4 --to webm -s video_quality=small</tspan></text>
<text x="22" y="89" xml:space="preserve"><tspan fill="#5ee08a" font-weight="600">✔︎</tspan><tspan fill="#d6e2f5"> vacances.mkv → D:\Videos\vacances.webm</tspan></text>
<text x="22" y="110" xml:space="preserve"><tspan fill="#f9c83a" font-weight="600">    Fidelity:</tspan><tspan fill="#ff9f43" font-weight="600"> Lossy</tspan></text>
<text x="22" y="131" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: lossy WebM encoding</tspan></text>
<text x="22" y="152" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: video re-encoded to VP9 (libvpx-vp9), source h264</tspan></text>
<text x="22" y="173" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: audio re-encoded to Opus (source aac)</tspan></text>
<text x="22" y="194" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: Opus works at 48 kHz: the audio is resampled</tspan></text>
<text x="22" y="215" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: ASS subtitles converted to webvtt: text and timing kept, advanced styles (fonts,</tspan></text>
<text x="22" y="236" xml:space="preserve"><tspan fill="#d6e2f5">      colors, positions, effects) lost if any</tspan></text>
<text x="22" y="257" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Target format limit: Codecs limited to VP8/VP9/AV1 (video) and Opus/Vorbis (audio)</tspan></text>
<text x="22" y="278" xml:space="preserve"><tspan fill="#5ee08a">    ✓ verified: streams and duration checked with ffprobe; fully decoded without errors</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="600">✘</tspan><tspan fill="#ffc2c2"> reunion.mp4: step 1 (ffmpeg): invalid or corrupt input file: MP4/MOV index missing: truncated file</tspan></text>
<text x="22" y="320" xml:space="preserve"><tspan fill="#ffc2c2">  or interrupted recording (FFmpeg: moov atom not found)</tspan></text>

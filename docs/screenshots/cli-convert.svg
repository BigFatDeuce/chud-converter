<svg xmlns="http://www.w3.org/2000/svg" width="884" height="389" viewBox="0 0 884 389" role="img" aria-label="Sortie réelle de la commande chud convert">
<title>chud convert vacances.mkv reunion.mp4 --to webm -s video_quality=small</title>
<style>text{font-family:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre}.t{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}</style>
<rect x="0.5" y="0.5" width="883" height="388" rx="10" fill="#011128" stroke="#123f7d"/>
<path d="M0.5 36V10.5a10 10 0 0 1 10-10h863a10 10 0 0 1 10 10V36Z" fill="#0a1f3f"/>
<line x1="0.5" y1="36" x2="883.5" y2="36" stroke="#123f7d"/>
<circle cx="20" cy="18.0" r="6" fill="#ff5f57"/>
<circle cx="40" cy="18.0" r="6" fill="#febc2e"/>
<circle cx="60" cy="18.0" r="6" fill="#28c840"/>
<text class="t" x="442.0" y="22.5" text-anchor="middle" fill="#8fa8c8">Windows PowerShell — chud</text>
<text x="22" y="68" xml:space="preserve"><tspan fill="#38d6ff" font-weight="600">PS D:\Videos&gt; </tspan><tspan fill="#ffffff" font-weight="600">chud convert vacances.mkv reunion.mp4 --to webm -s video_quality=small</tspan></text>
<text x="22" y="89" xml:space="preserve"><tspan fill="#5ee08a" font-weight="600">✔︎</tspan><tspan fill="#d6e2f5"> vacances.mkv → D:\Videos\vacances.webm</tspan></text>
<text x="22" y="110" xml:space="preserve"><tspan fill="#f9c83a" font-weight="600">    Fidélité :</tspan><tspan fill="#ff9f43" font-weight="600"> Avec perte</tspan></text>
<text x="22" y="131" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Étape 1 : encodage WebM avec perte</tspan></text>
<text x="22" y="152" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Étape 1 : vidéo ré-encodée en VP9 (libvpx-vp9), source h264</tspan></text>
<text x="22" y="173" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Étape 1 : audio ré-encodé en Opus (source aac)</tspan></text>
<text x="22" y="194" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Étape 1 : Opus fonctionne à 48 kHz : l&#x27;audio est rééchantillonné</tspan></text>
<text x="22" y="215" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Étape 1 : sous-titres ASS convertis en webvtt : texte et temps conservés, styles avancés</tspan></text>
<text x="22" y="236" xml:space="preserve"><tspan fill="#d6e2f5">      (polices, couleurs, positions, effets) perdus s&#x27;il y en a</tspan></text>
<text x="22" y="257" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Limite du format cible : Codecs limités à VP8/VP9/AV1 (vidéo) et Opus/Vorbis (audio)</tspan></text>
<text x="22" y="278" xml:space="preserve"><tspan fill="#5ee08a">    ✓ vérifié : flux et durée contrôlés par ffprobe ; décodage intégral sans erreur</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="600">✘</tspan><tspan fill="#ffc2c2"> reunion.mp4 : étape 1 (ffmpeg) : fichier d&#x27;entrée invalide ou corrompu : index MP4/MOV absent :</tspan></text>
<text x="22" y="320" xml:space="preserve"><tspan fill="#ffc2c2">  fichier tronqué ou enregistrement interrompu (FFmpeg : moov atom not found)</tspan></text>
<text x="22" y="341" xml:space="preserve"></text>
<text x="22" y="362" xml:space="preserve"><tspan fill="#ffffff" font-weight="600">1 réussie(s), 1 échec(s).</tspan></text>
</svg>

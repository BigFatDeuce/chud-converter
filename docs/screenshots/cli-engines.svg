<text x="22" y="257" xml:space="preserve"><tspan fill="#7f93b3">                           installation : winget install JohnMacFarlane.Pandoc</tspan></text>
<text x="22" y="278" xml:space="preserve"><tspan fill="#ffffff" font-weight="600">LibreOffice                </tspan><tspan fill="#7f93b3" font-weight="600">absent</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#7f93b3">                           installation : winget install TheDocumentFoundation.LibreOffice</tspan></text>
<text x="22" y="320" xml:space="preserve"><tspan fill="#ffffff" font-weight="600">Calibre (ebook-convert)    </tspan><tspan fill="#7f93b3" font-weight="600">absent</tspan></text>
<text x="22" y="341" xml:space="preserve"><tspan fill="#7f93b3">                           installation : winget install calibre.calibre</tspan></text>

<text class="t" x="442.0" y="22.5" text-anchor="middle" fill="#8fa8c8">Windows PowerShell — chud</text>
<text x="22" y="68" xml:space="preserve"><tspan fill="#38d6ff" font-weight="600">PS D:\Videos&gt; </tspan><tspan fill="#ffffff" font-weight="600">chud engines</tspan></text>
<text x="22" y="89" xml:space="preserve"><tspan fill="#d6e2f5">Données : C:\Users\you\AppData\Local\Chud Converter\data</tspan></text>
<text x="22" y="110" xml:space="preserve"><tspan fill="#d6e2f5">Moteurs intégrés : images (natif), données (natif)</tspan></text>
<text x="22" y="131" xml:space="preserve"></text>
<text x="22" y="152" xml:space="preserve"><tspan fill="#ffffff" font-weight="600">FFmpeg                     </tspan><tspan fill="#5ee08a" font-weight="600">prêt</tspan><tspan fill="#d6e2f5"> — 9.0.2-full_build-www.gyan.dev</tspan></text>
<text x="22" y="173" xml:space="preserve"><tspan fill="#7f93b3">                           C:\Users\you\AppData\Local\Microsoft\WinGet\Links\ffmpeg.exe [système]</tspan></text>
<text x="22" y="194" xml:space="preserve"><tspan fill="#ffffff" font-weight="600">7-Zip                      </tspan><tspan fill="#5ee08a" font-weight="600">prêt</tspan><tspan fill="#d6e2f5"> — 26.06</tspan></text>
<text x="22" y="215" xml:space="preserve"><tspan fill="#7f93b3">                           C:\Program Files\7-Zip\7z.exe [système]</tspan></text>

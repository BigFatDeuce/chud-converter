<text x="22" y="278" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: fidelity depends on the file&#x27;s content</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Lost if present: embedded fonts (not kept by the engine)</tspan></text>

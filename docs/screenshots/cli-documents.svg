<text class="t" x="442.0" y="22.5" text-anchor="middle" fill="#8fa8c8">Windows PowerShell — chud</text>
<text x="22" y="68" xml:space="preserve"><tspan fill="#38d6ff" font-weight="600">PS D:\Documents&gt; </tspan><tspan fill="#ffffff" font-weight="600">chud convert notes.md --to docx</tspan></text>
<text x="22" y="89" xml:space="preserve"><tspan fill="#5ee08a" font-weight="600">✔︎</tspan><tspan fill="#d6e2f5"> notes.md → D:\Documents\notes.docx</tspan></text>
<text x="22" y="110" xml:space="preserve"><tspan fill="#f9c83a" font-weight="600">    Fidelity:</tspan><tspan fill="#f9c83a" font-weight="600"> Depends on the file&#x27;s content</tspan></text>
<text x="22" y="131" xml:space="preserve"><tspan fill="#6ea8ff" font-weight="600">    •</tspan><tspan fill="#d6e2f5"> Step 1: fidelity depends on the file&#x27;s content</tspan></text>

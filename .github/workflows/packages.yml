name: Paquets de test

# Paquets Linux (AppImage, .deb, .rpm) construits comme pour une publication, mais sans rien
# publier ni signer : pour les essayer avant de créer un tag. Lancement à la main seulement.
# Le .deb est ensuite installé sur une Ubuntu propre et l'application démarrée sans écran.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Paquets Linux
    # Même système que pour les publications : l'AppImage fonctionne sur les plus récents.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file

      - name: Construction
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: paquets-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/chud
          if-no-files-found: error
          retention-days: 14

  deb:
    name: Essai du .deb (Ubuntu ${{ matrix.ubuntu }})
    needs: linux
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets-linux
          path: paquets
      - name: Installation et démarrage sans écran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ./paquets/bundle/deb/*.deb
          dpkg -c paquets/bundle/deb/*.deb | grep -E 'bin/|\.desktop$'
          chmod +x paquets/chud
          paquets/chud --lang en engines
          # L'application doit démarrer et rester ouverte (aucune bibliothèque manquante).
          xvfb-run -a sh -c 'chud-converter & p=$!; sleep 15; kill -0 $p && echo "toujours ouverte après 15 s" && kill $p'

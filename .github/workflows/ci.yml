name: CI

# La documentation seule ne relance pas la compilation et les tests.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pas de compilation incrémentale en CI : cache deux fois plus petit, rien à y gagner ici.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Un seul cache par système, enregistré depuis main uniquement (limite de 10 Go par dépôt).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Bibliothèques système de Tauri (WebKitGTK) pour l'application de bureau.
      - name: Dépendances de l'application (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      # L'interface doit être construite avant Rust : Tauri l'intègre au programme.
      - name: Interface (vérification et construction)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build

      # Moteurs externes : sans eux, les tests réels s'afficheraient « SKIP » sans rien prouver.
      - name: Moteurs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg 7zip

      - name: Moteurs (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Moteurs détectés
        run: cargo run -q -p chud-cli -- engines

      - name: Mise en forme
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
        env:
          CHUD_REQUIRE_ENGINES: "1"
